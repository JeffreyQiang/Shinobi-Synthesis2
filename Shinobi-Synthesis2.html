    <style>

<body>
    <!-- ===== HTML 结构（与之前完全一致） ===== -->
    <!-- 主页、规则书、大厅、角色选择、游戏界面、胜利面板全部保留 -->
    <!-- 为节省篇幅，此处省略重复的 HTML，实际输出包含全部 -->

    <script>
        // ============================================================
        //  Shinobi Synthesis v1.2  ·  回合权限修复  ·  选人同步增强
        // ============================================================
        console.log('🟢 Shinobi Synthesis v1.2 加载成功！');

        // ============================================================
        // 1. 音效 & 视觉反馈（完整）
        // ============================================================
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function ensureAudio() {
            if (!audioCtx) { try { audioCtx = new AudioCtx(); } catch (e) {} }
            if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); }
            return audioCtx;
        }

        function playTone(freq, duration, type = 'sine', volume = 0.15) {
            try {
                const ctx = ensureAudio();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.value = volume;
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }

        function playSound(name) {
            switch (name) {
                case 'card':
                    playTone(600, 0.1, 'sine', 0.1);
                    setTimeout(() => playTone(800, 0.08, 'sine', 0.08), 100);
                    break;
                case 'damage':
                    playTone(200, 0.2, 'sawtooth', 0.12);
                    break;
                case 'heal':
                    playTone(900, 0.15, 'sine', 0.1);
                    setTimeout(() => playTone(1100, 0.15, 'sine', 0.08), 120);
                    break;
                case 'synthesis':
                    playTone(400, 0.15, 'square', 0.08);
                    setTimeout(() => playTone(600, 0.15, 'square', 0.06), 150);
                    setTimeout(() => playTone(800, 0.2, 'square', 0.04), 300);
                    break;
                case 'freeze':
                    playTone(300, 0.3, 'sine', 0.06);
                    setTimeout(() => playTone(200, 0.3, 'sine', 0.04), 200);
                    break;
                case 'burn':
                    playTone(150, 0.4, 'sawtooth', 0.05);
                    break;
                default:
                    break;
            }
        }

        function showFloatNumber(x, y, text, type) {
            const el = document.createElement('div');
            el.className = 'float-number ' + type;
            el.textContent = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function showDamageOnTarget(targetId, amount, isHeal) {
            const hpEl = document.getElementById(targetId === 1 ? 'p1-hp' : 'p2-hp');
            if (!hpEl) return;
            const rect = hpEl.getBoundingClientRect();
            const x = rect.left + rect.width / 2 - 20;
            const y = rect.top - 20;
            showFloatNumber(x, y, (isHeal ? '+' : '-') + Math.abs(amount), isHeal ? 'heal' : 'damage');
            playSound(isHeal ? 'heal' : 'damage');
        }

        function flyCard(fromEl, targetId, cb) {
            const rect = fromEl.getBoundingClientRect();
            const clone = fromEl.cloneNode(true);
            clone.className = 'flying-card';
            clone.style.left = rect.left + 'px';
            clone.style.top = rect.top + 'px';
            clone.style.width = rect.width + 'px';
            clone.style.height = rect.height + 'px';
            clone.textContent = fromEl.querySelector('.emoji-big')?.textContent || '🌀';
            document.body.appendChild(clone);
            const targetRect = document.getElementById(targetId)?.getBoundingClientRect();
            if (targetRect) {
                const dx = targetRect.left + targetRect.width / 2 - rect.left - rect.width / 2;
                const dy = targetRect.top + targetRect.height / 2 - rect.top - rect.height / 2;
                clone.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(0.6) rotate(20deg)';
                clone.style.opacity = '0.5';
            } else {
                clone.style.transform = 'scale(0.1)';
                clone.style.opacity = '0';
            }
            setTimeout(() => {
                clone.remove();
                if (cb) cb();
            }, 500);
            playSound('card');
        }

        function showSynthesisEffect() {
            const flash = document.createElement('div');
            flash.className = 'synthesis-flash';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 600);
            playSound('synthesis');
        }

        function applyStateEffect(playerId, type) {
            const area = document.getElementById(playerId === 1 ? 'p1-area' : 'p2-area');
            if (!area) return;
            area.querySelectorAll('.freeze-effect, .burn-effect').forEach(el => el.remove());
            if (type === 'freeze') {
                const el = document.createElement('div');
                el.className = 'freeze-effect';
                area.appendChild(el);
                playSound('freeze');
            } else if (type === 'burn') {
                const el = document.createElement('div');
                el.className = 'burn-effect';
                area.appendChild(el);
                playSound('burn');
            }
        }

        function clearStateEffects(playerId) {
            const area = document.getElementById(playerId === 1 ? 'p1-area' : 'p2-area');
            if (!area) return;
            area.querySelectorAll('.freeze-effect, .burn-effect').forEach(el => el.remove());
        }

        // ============================================================
        // 2. 核心数据
        // ============================================================
        const ROLES = {
            naruto: { id: 'naruto', name: '鸣人', emoji: '🍥', faction: '木叶', skill: 'shadow_clone', skillName: '影分身', skillDesc: '每回合第一次受击50%闪避' },
            sasuke: { id: 'sasuke', name: '佐助', emoji: '⚡', faction: '木叶', skill: 'sharingan', skillName: '写轮眼', skillDesc: '每回合第一次伤害+3' },
            sakura: { id: 'sakura', name: '小樱', emoji: '🌸', faction: '木叶', skill: 'medical', skillName: '医疗天赋', skillDesc: '回血+1；木系牌治疗+2' },
            itachi: { id: 'itachi', name: '鼬', emoji: '👁️', faction: '晓', skill: 'mangekyo', skillName: '万花筒', skillDesc: '每回合第一张牌打出后抽1张' },
            kisame: { id: 'kisame', name: '鬼鲛', emoji: '🦈', faction: '晓', skill: 'samehada', skillName: '鲛肌·饕餮', skillDesc: '50%吸1查克拉；对手查克拉0时伤害+2' },
            jiraiya: { id: 'jiraiya', name: '自来也', emoji: '🐸', faction: '木叶', skill: 'summon', skillName: '蛤蟆召唤', skillDesc: '每回合第一次出牌后召唤：吉10%(+1查)、志麻30%(+2血)、文太30%(-3敌血)、失败30%' },
            madara: { id: 'madara', name: '宇智波斑', emoji: '🔥', faction: '晓', skill: 'reflect', skillName: '写轮眼·反弹', skillDesc: '每回合第一次受击反弹50%伤害（上限4）' }
        };
        var ROLE_KEYS = Object.keys(ROLES);

        var BASE_POOL = [
            { name: '螺旋丸', element: '🌀', atk: 5, heal: 0, level: 'base' },
            { name: '千杀水翔', element: '❄️', atk: 4, heal: 0, level: 'base' },
            { name: '掌仙术', element: '🌿', atk: 0, heal: 6, level: 'base' },
            { name: '千鸟', element: '⚡', atk: 8, heal: 0, level: 'base' },
            { name: '影手里剑', element: '🌑', atk: 6, heal: 0, level: 'base' }
        ];

        var ADV_MAP = {
            '🌀': { name: '风遁·螺旋手里剑', element: '🌪️', atk: 10, heal: 0, level: 'advanced' },
            '❄️': { name: '冰遁·魔镜冰晶', element: '🧊', atk: 8, heal: 0, level: 'advanced' },
            '🌿': { name: '创造再生', element: '💫', atk: 0, heal: 12, level: 'advanced' },
            '⚡': { name: '麒麟', element: '⚡⚡', atk: 16, heal: 0, level: 'advanced' },
            '🌑': { name: '天照', element: '🔥👁️', atk: 12, heal: 0, level: 'advanced' }
        };

        // ============================================================
        // 3. 游戏状态
        // ============================================================
        var selectedRoles = { p1: [], p2: [] };
        var localPlayerId = 1;
        var readyState = { p1: false, p2: false };

        var MAX_ROOMS = 5;
        var ROOM_IDS = [];
        for (var i = 1; i <= MAX_ROOMS; i++) ROOM_IDS.push('shinobi-' + i);

        var lobby = {
            peer: null,
            conn: null,
            roomIndex: -1,
            isHost: false,
            password: null,
            gameStarted: false,
            gameOver: false,
            waitingForReturn: false
        };

        var gameState = {
            teams: { p1: { members: [], currentIndex: 0 }, p2: { members: [], currentIndex: 0 } },
            turn: 1,
            gameOver: false,
            discardMode: false,
            enhancePending: false,
            roundCounter: 1,
            totalDamage: { p1: 0, p2: 0 },
            totalHeal: { p1: 0, p2: 0 },
            totalBurnDamage: { p1: 0, p2: 0 },
            skillTriggered: {
                p1: { shadow_clone: false, sharingan: false, mangekyo: false, samehada: false, summon: false, reflect: false },
                p2: { shadow_clone: false, sharingan: false, mangekyo: false, samehada: false, summon: false, reflect: false }
            },
            lastPlayedCard: { p1: null, p2: null },
            winner: null
        };

        // ============================================================
        // 4. DOM 引用
        // ============================================================
        var $ = function(id) { return document.getElementById(id); };
        var logArea = $('log-area');
        var p1HandEl = $('p1-hand');
        var p2HandEl = $('p2-hand');
        var p1Overlay = $('p1-overlay');
        var p2Overlay = $('p2-overlay');
        var p1Status = $('p1-status');
        var p2Status = $('p2-status');
        var p1ChakraEl = $('p1-chakra');
        var p2ChakraEl = $('p2-chakra');
        var turnIndicator = $('turn-indicator');
        var btnSynth = $('btn-synthesize');
        var btnDiscard = $('btn-discard');
        var btnEnd = $('btn-end-turn');
        var btnRestart = $('btn-restart');
        var btnSubstitute = $('btn-substitute');
        var p1Alive = $('p1-alive');
        var p2Alive = $('p2-alive');
        var p1Members = $('p1-members');
        var p2Members = $('p2-members');
        var p1CurrentRole = $('p1-current-role');
        var p2CurrentRole = $('p2-current-role');
        var p1TeamName = $('p1-team-name');
        var p2TeamName = $('p2-team-name');
        var p1HpEl = $('p1-hp');
        var p2HpEl = $('p2-hp');
        var p1HpBar = $('p1-hp-bar');
        var p2HpBar = $('p2-hp-bar');

        // ============================================================
        // 5. 辅助函数
        // ============================================================
        function log(html) {
            var entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = html;
            logArea.prepend(entry);
            while (logArea.children.length > 30) logArea.removeChild(logArea.lastChild);
        }

        function clearLog() {
            logArea.innerHTML = '';
            log('🍥 2v2 忍界大战开始！');
        }

        function getTeam(playerId) {
            return playerId === 1 ? gameState.teams.p1 : gameState.teams.p2;
        }

        function getCurrentMember(playerId) {
            var team = getTeam(playerId);
            if (team.members.length === 0) return null;
            return team.members[team.currentIndex] || null;
        }

        function getCurrentRoleObj(playerId) {
            var member = getCurrentMember(playerId);
            return member ? ROLES[member.roleId] : null;
        }

        function hasSkill(playerId, skillId) {
            var role = getCurrentRoleObj(playerId);
            return role && role.skill === skillId;
        }

        function getAliveCount(team) {
            return team.members.filter(function(m) { return m.hp > 0; }).length;
        }

        function switchToNextAlive(playerId) {
            var team = getTeam(playerId);
            if (team.members.length === 0) return;
            var aliveIndices = team.members.map(function(m, i) { return m.hp > 0 ? i : -1; }).filter(function(i) { return i >= 0; });
            if (aliveIndices.length > 0) {
                team.currentIndex = aliveIndices[0];
            } else {
                team.currentIndex = -1;
            }
        }

        // ============================================================
        // 6. 卡牌系统
        // ============================================================
        function drawOne(playerId) {
            var member = getCurrentMember(playerId);
            if (!member) return null;
            if (!member.hand) member.hand = [];
            if (member.hand.length >= 4) return null;
            var elementCount = {};
            member.hand.forEach(function(c) {
                if (c.level === 'base') {
                    elementCount[c.element] = (elementCount[c.element] || 0) + 1;
                }
            });
            var weightedPool = BASE_POOL.map(function(c) {
                var w = 1;
                if (elementCount[c.element] && elementCount[c.element] > 0) w += 1;
                if (member.hp < 20 && c.element === '🌿') w += 4;
                return { card: c, weight: w };
            });
            var total = weightedPool.reduce(function(s, i) { return s + i.weight; }, 0);
            var rand = Math.random() * total;
            var selected = weightedPool[0].card;
            for (var idx = 0; idx < weightedPool.length; idx++) {
                rand -= weightedPool[idx].weight;
                if (rand <= 0) {
                    selected = weightedPool[idx].card;
                    break;
                }
            }
            var card = JSON.parse(JSON.stringify(selected));
            if (card.level !== 'base') {
                card.name = '螺旋丸';
                card.element = '🌀';
                card.atk = 5;
                card.heal = 0;
                card.level = 'base';
            }
            member.hand.push(card);
            if (playerId === localPlayerId) {
                addCardToDOM(playerId, card);
            }
            return card;
        }

        function addCardToDOM(playerId, card) {
            if (playerId !== localPlayerId) return;
            var container = playerId === 1 ? p1HandEl : p2HandEl;
            var div = document.createElement('div');
            div.className = 'card';
            if (card.level === 'advanced') div.classList.add('advanced-card');
            div.dataset.name = card.name;
            div.dataset.element = card.element;
            div.dataset.atk = card.atk;
            div.dataset.heal = card.heal;
            div.dataset.level = card.level;
            div.dataset.player = playerId;
            div.innerHTML =
                '<span class="emoji-big">' + card.element + '</span>' +
                '<span class="card-name">' + card.name + '</span>' +
                '<div class="card-stats">' +
                (card.atk > 0 ? '<span class="atk">⚔️' + card.atk + '</span>' : '') +
                (card.heal > 0 ? '<span class="heal">💚' + card.heal + '</span>' : '') +
                '</div>' +
                '<span class="level-badge">' + (card.level === 'advanced' ? '⭐奥义' : '基础') + '</span>' +
                '<button class="discard-btn">✕</button>';
            div.addEventListener('click', function(e) {
                if (e.target.classList.contains('discard-btn')) return;
                if (gameState.discardMode) { log('💡 点击 ✕ 换牌'); return; }
                if (playerId !== gameState.turn) { log('⛔ 这不是你的回合！'); return; }
                if (gameState.enhancePending) {
                    var member = getCurrentMember(playerId);
                    if (member.chakra >= 2) {
                        member.chakra -= 2;
                        gameState.enhancePending = false;
                        var cardData = {
                            name: card.name,
                            element: card.element,
                            atk: parseInt(div.dataset.atk) + 5,
                            heal: parseInt(div.dataset.heal) + 5,
                            level: card.level
                        };
                        div.remove();
                        syncHandFromDOM(playerId);
                        sendAction({ type: 'playCard', playerId: playerId, cardData: cardData, enhanced: true });
                        playCardDataLocal(playerId, cardData, true);
                        return;
                    } else {
                        log('⛔ 查克拉不足，需要2点');
                        gameState.enhancePending = false;
                        render();
                        return;
                    }
                } else {
                    playCardFromDOM(playerId, div);
                }
            });
            var btn = div.querySelector('.discard-btn');
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (gameState.discardMode) {
                    discardCardFromDOM(playerId, div);
                } else {
                    log('💡 请先进入换牌模式');
                }
            });
            container.appendChild(div);
        }

        function clearHandDOM(playerId) {
            var container = playerId === 1 ? p1HandEl : p2HandEl;
            container.innerHTML = '';
        }

        function syncHandFromDOM(playerId) {
            var container = playerId === 1 ? p1HandEl : p2HandEl;
            var cards = container.querySelectorAll('.card');
            var hand = [];
            cards.forEach(function(el) {
                hand.push({
                    name: el.dataset.name,
                    element: el.dataset.element,
                    atk: parseInt(el.dataset.atk) || 0,
                    heal: parseInt(el.dataset.heal) || 0,
                    level: el.dataset.level || 'base'
                });
            });
            var member = getCurrentMember(playerId);
            if (member) member.hand = hand;
        }

        // ============================================================
        // 7. 核心战斗逻辑
        // ============================================================
        function applyCardLocal(card, ownerPlayerId, targetPlayerId) {
            var dmg = card.atk || 0;
            var heal = card.heal || 0;
            var extra = '';
            var owner = getCurrentMember(ownerPlayerId);
            var target = getCurrentMember(targetPlayerId);
            if (!owner || !target) return { log: '⚠️ 角色不存在', dmg: 0, heal: 0 };

            if (card.level === 'advanced') {
                if (card.element === '🌪️') {
                    target.burn = (target.burn || 0) + 2;
                    extra += ' 🔥灼烧2层';
                    applyStateEffect(targetPlayerId, 'burn');
                } else if (card.element === '🧊') {
                    target.freeze = (target.freeze || 0) + 1;
                    extra += ' ❄️冻结1回合';
                    applyStateEffect(targetPlayerId, 'freeze');
                } else if (card.element === '💫') {
                    if (owner.burn > 0) {
                        extra += ' ✨解除灼烧' + owner.burn + '层';
                        owner.burn = 0;
                        clearStateEffects(ownerPlayerId);
                    }
                    if (owner.freeze > 0) {
                        extra += ' ✨解除冻结' + owner.freeze + '层';
                        owner.freeze = 0;
                        clearStateEffects(ownerPlayerId);
                    }
                    if (owner.burn === 0 && owner.freeze === 0) {
                        extra += ' ✨已净化';
                    }
                } else if (card.element === '⚡⚡') {
                    if (owner.hand.length < 4) {
                        var nc = drawOne(ownerPlayerId);
                        if (nc) {
                            extra += ' 📜抽1张牌';
                        } else {
                            extra += ' ⚠️手牌已满';
                        }
                    } else {
                        extra += ' ⚠️手牌已满';
                    }
                } else if (card.element === '🔥👁️') {
                    if (dmg > 0) {
                        var h = Math.floor(dmg * 0.6);
                        owner.hp = Math.min(owner.maxHp, owner.hp + h);
                        extra += ' 🩸吸血 ' + h;
                        if (h > 0) {
                            if (ownerPlayerId === 1) gameState.totalHeal.p1 += h;
                            else gameState.totalHeal.p2 += h;
                        }
                    }
                }
            }
            if (hasSkill(ownerPlayerId, 'medical') && card.element === '🌿') {
                heal += 2;
                extra += ' 🌸医疗天赋：木系治疗+2';
            }

            var actualDmg = 0,
                actualHeal = 0;
            if (dmg > 0 && hasSkill(targetPlayerId, 'shadow_clone')) {
                var key = targetPlayerId === 1 ? 'p1' : 'p2';
                if (!gameState.skillTriggered[key].shadow_clone) {
                    if (Math.random() < 0.5) { dmg = 0;
                        extra += ' 🍥影分身闪避！'; }
                    gameState.skillTriggered[key].shadow_clone = true;
                }
            }
            if (dmg > 0 && hasSkill(ownerPlayerId, 'sharingan')) {
                var key2 = ownerPlayerId === 1 ? 'p1' : 'p2';
                if (!gameState.skillTriggered[key2].sharingan) { dmg += 3;
                    extra += ' ⚡写轮眼！';
                    gameState.skillTriggered[key2].sharingan = true; }
            }
            if (dmg > 0) {
                actualDmg = dmg;
                target.hp = Math.max(0, target.hp - actualDmg);
                if (ownerPlayerId === 1) gameState.totalDamage.p1 += actualDmg;
                else gameState.totalDamage.p2 += actualDmg;
            }
            if (heal > 0) {
                var old = owner.hp;
                owner.hp = Math.min(owner.maxHp, owner.hp + heal);
                actualHeal = owner.hp - old;
                if (actualHeal > 0) {
                    if (ownerPlayerId === 1) gameState.totalHeal.p1 += actualHeal;
                    else gameState.totalHeal.p2 += actualHeal;
                }
            }

            if (actualDmg > 0 && hasSkill(ownerPlayerId, 'samehada')) {
                var key3 = ownerPlayerId === 1 ? 'p1' : 'p2';
                if (!gameState.skillTriggered[key3].samehada) {
                    gameState.skillTriggered[key3].samehada = true;
                    if (Math.random() < 0.5) {
                        if (target.chakra > 0) {
                            target.chakra -= 1;
                            owner.chakra = Math.min(3, owner.chakra + 1);
                            extra += ' 🦈吸1查克拉';
                        } else {
                            actualDmg += 2;
                            target.hp = Math.max(0, target.hp - 2);
                            if (ownerPlayerId === 1) gameState.totalDamage.p1 += 2;
                            else gameState.totalDamage.p2 += 2;
                            extra += ' 🦈查克拉0，伤害+2';
                        }
                    }
                }
            }
            if (actualDmg > 0 && hasSkill(targetPlayerId, 'reflect')) {
                var key4 = targetPlayerId === 1 ? 'p1' : 'p2';
                if (!gameState.skillTriggered[key4].reflect) {
                    gameState.skillTriggered[key4].reflect = true;
                    var reflected = Math.ceil(actualDmg * 0.5);
                    if (reflected > 4) reflected = 4;
                    if (reflected > 0) {
                        owner.hp = Math.max(0, owner.hp - reflected);
                        if (ownerPlayerId === 1) gameState.totalDamage.p1 += reflected;
                        else gameState.totalDamage.p2 += reflected;
                        extra += ' 🔥写轮眼反弹 ' + reflected + ' 点伤害！';
                        if (owner.hp <= 0) owner.hp = 0;
                    }
                }
            }

            if (actualDmg > 0) showDamageOnTarget(targetPlayerId, actualDmg, false);
            else if (actualHeal > 0) showDamageOnTarget(ownerPlayerId, actualHeal, true);

            // 死亡检查
            if (target.hp <= 0) {
                target.hp = 0;
                var team = getTeam(targetPlayerId);
                var dead = team.members.filter(function(m) { return m.hp <= 0; }).length;
                var roleName = ROLES[target.roleId] ? ROLES[target.roleId].emoji + ROLES[target.roleId].name : '角色';
                log('💀 ' + roleName + ' 阵亡！');
                switchToNextAlive(targetPlayerId);
                if (getAliveCount(team) === 0) {
                    gameState.gameOver = true;
                    var winner = targetPlayerId === 1 ? 2 : 1;
                    gameState.winner = winner;
                    log('💀 玩家' + targetPlayerId + '小队全灭！玩家' + winner + '胜利！');
                    showVictory(winner);
                    render();
                    return { log: '💀 ' + roleName + ' 阵亡！' };
                }
            }
            if (owner.hp <= 0) {
                owner.hp = 0;
                var team2 = getTeam(ownerPlayerId);
                var dead2 = team2.members.filter(function(m) { return m.hp <= 0; }).length;
                var roleName2 = ROLES[owner.roleId] ? ROLES[owner.roleId].emoji + ROLES[owner.roleId].name : '角色';
                log('💀 ' + roleName2 + ' 被反弹致死！');
                switchToNextAlive(ownerPlayerId);
                if (getAliveCount(team2) === 0) {
                    gameState.gameOver = true;
                    var winner2 = ownerPlayerId === 1 ? 2 : 1;
                    gameState.winner = winner2;
                    log('💀 玩家' + ownerPlayerId + '小队全灭！玩家' + winner2 + '胜利！');
                    showVictory(winner2);
                    render();
                    return { log: '💀 ' + roleName2 + ' 被反弹致死！' };
                }
            }

            var msg = '';
            if (actualDmg > 0) msg += ' ⚔️造成 <span class="damage">' + actualDmg + '</span> 伤害';
            if (actualHeal > 0) msg += ' 💚恢复 <span class="heal">' + actualHeal + '</span> 生命';
            if (extra) msg += ' ' + extra;
            return { log: msg, dmg: actualDmg, heal: actualHeal };
        }

        function playCardFromDOM(playerId, cardElement) {

                log('⛔ 不是你的回合，不能出牌');

            }

            if (gameState.discardMode) { log('⛔ 请先退出换牌模式'); return; }

            var card = {
                name: cardElement.dataset.name,
                element: cardElement.dataset.element,
                atk: parseInt(cardElement.dataset.atk) || 0,
                heal: parseInt(cardElement.dataset.heal) || 0,

            };

            var playerKey = playerId === 1 ? 'p1' : 'p2';
            gameState.lastPlayedCard[playerKey] = JSON.parse(JSON.stringify(card));
            var res = applyCardLocal(card, playerId, targetId);
            var role = getCurrentRoleObj(playerId);
            var roleName = role ? role.emoji + role.name : '玩家' + playerId;
            log('🧙 ' + roleName + ' 打出 <span class="highlight">' + card.element + ' ' + card.name + '</span> → ' + res.log);
            triggerPassive(playerId, targetId);
            sendAction({ type: 'playCard', playerId: playerId, cardData: card, enhanced: false });

        function triggerPassive(playerId, targetId) {
            var member = getCurrentMember(playerId);
            var target = getCurrentMember(targetId);
            if (!member || !target) return;

            if (hasSkill(playerId, 'mangekyo')) {
                var key = playerId === 1 ? 'p1' : 'p2';
                if (!gameState.skillTriggered[key].mangekyo) {
                    gameState.skillTriggered[key].mangekyo = true;
                    var nc = drawOne(playerId);
                    if (nc) { log('👁️ 鼬 万花筒！额外抽1张'); }
                }
            }
            if (hasSkill(playerId, 'summon')) {
                var key2 = playerId === 1 ? 'p1' : 'p2';
                if (!gameState.skillTriggered[key2].summon) {
                    gameState.skillTriggered[key2].summon = true;
                    var rand = Math.random();
                    var effect = '';
                    if (rand < 0.1) {
                        member.chakra = Math.min(3, member.chakra + 1);
                        effect = '🐸 蛤蟆吉：+1查克拉！';
                    } else if (rand < 0.4) {
                        var healAmt = 2;
                        var old = member.hp;
                        member.hp = Math.min(member.maxHp, member.hp + healAmt);
                        var actual = member.hp - old;
                        if (actual > 0) {
                            if (playerId === 1) gameState.totalHeal.p1 += actual;
                            else gameState.totalHeal.p2 += actual;
                            showDamageOnTarget(playerId, actual, true);
                        }
                        effect = '🐸 志麻：恢复2点生命！';
                    } else if (rand < 0.7) {
                        var dmg = 3;
                        target.hp = Math.max(0, target.hp - dmg);
                        if (playerId === 1) gameState.totalDamage.p1 += dmg;
                        else gameState.totalDamage.p2 += dmg;
                        showDamageOnTarget(targetId, dmg, false);
                        effect = '🐸 文太：造成3点伤害！';
                    } else {
                        effect = '🐸 蛤蟆召唤失败...';
                    }
                    log('🐸 自来也：' + effect);
                    if (target.hp <= 0) {
                        target.hp = 0;
                        var team = getTeam(targetId);
                        var dead = team.members.filter(function(m) { return m.hp <= 0; }).length;
                        var roleName2 = ROLES[target.roleId] ? ROLES[target.roleId].emoji + ROLES[target.roleId].name :
                        '角色';
                        log('💀 ' + roleName2 + ' 阵亡！');
                        switchToNextAlive(targetId);
                        if (getAliveCount(team) === 0) {
                            gameState.gameOver = true;
                            var winner = targetId === 1 ? 2 : 1;
                            gameState.winner = winner;
                            log('💀 玩家' + targetId + '小队全灭！玩家' + winner + '胜利！');
                            showVictory(winner);
                            render();
                        }
                    }
                }
            }
        }

        function synthesize() {
            if (gameState.turn !== localPlayerId) {
                log('⛔ 不是你的回合，不能合成');
                return;
            }
            if (gameState.gameOver) { log('⛔ 游戏已结束'); return; }
            var playerId = gameState.turn;
            var member = getCurrentMember(playerId);
            if (!member) { log('⛔ 没有可用角色'); return; }
            if (member.freeze > 0) { log('❄️ 被冻结，无法合成'); return; }
            if (gameState.discardMode) {
                gameState.discardMode = false;
                btnDiscard.textContent = '🔄 换牌';
                btnDiscard.classList.remove('active');
            }
            gameState.enhancePending = false;
            syncHandFromDOM(playerId);
            var hand = member.hand || [];
            var map = {};
            hand.forEach(function(c) {
                if (c.level === 'base') {
                    map[c.element] = (map[c.element] || 0) + 1;
                }
            });
            var target = null;
            for (var elem in map) {
                if (map[elem] >= 2) { target = elem; break; }
            }
            if (!target) { log('❌ 没有两张相同元素的基础忍术'); return; }

            var container = playerId === 1 ? p1HandEl : p2HandEl;
            var cards = container.querySelectorAll('.card');
            var removed = 0;
            var toRemove = [];
            cards.forEach(function(c) {
                if (removed < 2 && c.dataset.element === target && c.dataset.level === 'base') {
                    toRemove.push(c);
                    removed++;
                }
            });
            toRemove.forEach(function(c) { c.remove(); });
            var adv = ADV_MAP[target];
            if (!adv) { log('❌ 合成错误'); return; }
            if (playerId === localPlayerId) {
                addCardToDOM(playerId, adv);
            }
            // 更新数据
            var idx1 = member.hand.findIndex(function(c) { return c.element === target && c.level === 'base'; });
            if (idx1 !== -1) member.hand.splice(idx1, 1);
            var idx2 = member.hand.findIndex(function(c) { return c.element === target && c.level === 'base'; });
            if (idx2 !== -1) member.hand.splice(idx2, 1);
            member.hand.push(JSON.parse(JSON.stringify(adv)));
            if (member.chakra < 3) member.chakra++;
            showSynthesisEffect();
            log('🔮 合成！' + target + ' → ' + adv.name);
            sendAction({ type: 'synthesize', playerId: playerId, target: target, advName: adv.name });
            render();
        }

        function useSubstitute() {
            if (gameState.turn !== localPlayerId) {
                log('⛔ 不是你的回合，无法使用替身术');
                return;
            }
            if (gameState.gameOver) { log('⛔ 游戏已结束'); return; }
            var playerId = gameState.turn;
            var member = getCurrentMember(playerId);
            if (!member) { log('⛔ 没有可用角色'); return; }
            if (member.freeze <= 0) { log('💡 没有处于冻结状态'); return; }
            if (member.chakra < 1) { log('⛔ 查克拉不足 (需要1点)'); return; }
            member.chakra -= 1;
            member.freeze = 0;
            clearStateEffects(playerId);
            log('🪵 使用替身术解除冻结！');
            sendAction({ type: 'substitute', playerId: playerId });
            render();
        }

        function applyBurns() {
            [1, 2].forEach(function(pid) {
                var member = getCurrentMember(pid);
                if (member && member.burn > 0) {
                    var burnDmg = 2;
                    member.hp = Math.max(0, member.hp - burnDmg);
                    if (pid === 1) gameState.totalBurnDamage.p1 += burnDmg;
                    else gameState.totalBurnDamage.p2 += burnDmg;
                    member.burn--;
                    log('🔥 玩家' + pid + '灼烧 -' + burnDmg);
                    if (member.burn === 0) clearStateEffects(pid);
                    if (member.hp <= 0) {
                        member.hp = 0;
                        var team = getTeam(pid);
                        var dead = team.members.filter(function(m) { return m.hp <= 0; }).length;
                        var roleName = ROLES[member.roleId] ? ROLES[member.roleId].emoji + ROLES[member.roleId].name :
                        '角色';
                        log('💀 ' + roleName + ' 阵亡！');
                        switchToNextAlive(pid);
                        if (getAliveCount(team) === 0) {
                            gameState.gameOver = true;
                            var winner = pid === 1 ? 2 : 1;
                            gameState.winner = winner;
                            log('💀 玩家' + pid + '小队全灭！玩家' + winner + '胜利！');
                            showVictory(winner);
                            render();
                        }
                    }
                }
            });
        }

        // ============================================================
        // 10. endTurn（含强化日志和修复）
        // ============================================================
        function endTurn() {
            if (gameState.turn !== localPlayerId) {
                log('⛔ 不是你的回合，不能结束回合');
                return;
            }
            if (gameState.gameOver) { log('⛔ 游戏已结束'); return; }
            gameState.enhancePending = false;
            var currentMember = getCurrentMember(gameState.turn);
            if (currentMember && currentMember.freeze > 0) {
                currentMember.freeze--;
                clearStateEffects(gameState.turn);
                log('❄️ 玩家' + gameState.turn + ' 冰牢剩余 ' + currentMember.freeze + ' 回合');
            }
            if (gameState.discardMode) {
                gameState.discardMode = false;
                btnDiscard.textContent = '🔄 换牌';
                btnDiscard.classList.remove('active');
            }
            if (currentMember) currentMember.discarded = false;
            applyBurns();
            if (gameState.gameOver) { render(); return; }

            var key = gameState.turn === 1 ? 'p1' : 'p2';
            gameState.skillTriggered[key] = {
                shadow_clone: false,
                sharingan: false,
                mangekyo: false,
                samehada: false,
                summon: false,
                reflect: false
            };

            if (gameState.turn === 1) {
                gameState.roundCounter++;
                log('📊 ===== 第 ' + gameState.roundCounter + ' 回合开始 =====');
            }
            // 切换回合
            gameState.turn = gameState.turn === 1 ? 2 : 1;

            var newMember = getCurrentMember(gameState.turn);
            if (newMember) {
                var healAmount = 1;
                if (hasSkill(gameState.turn, 'medical')) {
                    healAmount = 2;
                    log('🌸 小樱 医疗天赋：回血+1');
                }
                var oldHp = newMember.hp;
                newMember.hp = Math.min(newMember.maxHp, newMember.hp + healAmount);
                if (newMember.hp > oldHp) {
                    log('💚 玩家' + gameState.turn + ' 恢复' + healAmount + 'HP (当前 ' + newMember.hp + ')');
                }
                if (!(gameState.turn === 2 && gameState.roundCounter === 1)) {
                    var newCard = drawOne(gameState.turn);
                    if (newCard) { /* addCardToDOM already called in drawOne if local */ }
                } else {
                    log('⏭️ 玩家2第一回合不抽牌');
                }
            }
            log('🔄 轮到玩家' + gameState.turn + '的回合');
            // 发送消息给对手
            sendAction({ type: 'endTurn', playerId: gameState.turn, roundCounter: gameState.roundCounter });
            // 强制刷新UI
            render();
            // 额外日志
            console.log('✅ 回合结束，当前 turn =', gameState.turn, 'localPlayerId =', localPlayerId);
        }

        function showVictory(winner) {
            var overlay = document.getElementById('victory-overlay');
            var winnerName = document.getElementById('victory-winner-name');
            var winnerText = document.getElementById('victory-winner-text');
            var p1Dmg = document.getElementById('p1-dmg');

            winnerName.textContent = winner === 1 ? p1Label : p2Label;
            winnerName.className = 'victory-winner ' + (winner === 1 ? 'win-p1' : 'win-p2');

                if (localPlayerId === 2) {
                    p2Overlay.classList.remove('show');
                    if (p2Overlay.querySelector('.back-text')) p2Overlay.querySelector('.back-text').textContent = '🃏 你的手牌';
                } else {
                    p2Overlay.classList.add('show');
                    if (p2Overlay.querySelector('.back-text')) p2Overlay.querySelector('.back-text').textContent = '🃏 对手手牌';
                }
            }

            var p1Area = $('p1-area');
            var p2Area = $('p2-area');
            if (p1Area) p1Area.classList.toggle('active-turn', gameState.turn === 1 && !gameState.gameOver);
            if (p2Area) p2Area.classList.toggle('active-turn', gameState.turn === 2 && !gameState.gameOver);

            var allCards = document.querySelectorAll('.card');
            allCards.forEach(function(c) {
                var pid = parseInt(c.dataset.player);
                var isActive = (pid === gameState.turn && !gameState.gameOver);
                if (gameState.discardMode && isActive) {
                    c.classList.add('discard-mode');
                } else {
                    c.classList.remove('discard-mode');
                }
                if (isActive && !gameState.discardMode) {
                    c.classList.remove('disabled', 'enemy-card');
                } else {
                    c.classList.add('disabled');
                    if (!isActive) c.classList.add('enemy-card');
                }
            });

            if (btnDiscard) {
                if (gameState.discardMode) {
                    btnDiscard.textContent = '❌ 取消换牌';
                    btnDiscard.classList.add('active');
                } else {
                    btnDiscard.textContent = '🔄 换牌';
                    btnDiscard.classList.remove('active');
                }
            }

            // 替身术按钮
            if (btnSubstitute) {
                var cur = getCurrentMember(gameState.turn);
                var frozen = cur && cur.freeze > 0;
                var chakra = cur && cur.chakra >= 1;
                var isMyTurn = (gameState.turn === localPlayerId);
                btnSubstitute.disabled = !(frozen && chakra && isMyTurn);
                btnSubstitute.textContent = '🪵 解除冻结 (1查克拉)' + (frozen ? ' ❄️' : '');
            }

            // 结束回合按钮
            if (btnEnd) {
                btnEnd.disabled = (gameState.turn !== localPlayerId || gameState.gameOver);
            }

            // 合成按钮
            if (btnSynth) {
                btnSynth.disabled = (gameState.turn !== localPlayerId || gameState.gameOver);
            }

            // 忍术强化按钮
            var enhance = $('btn-enhance');
            if (!enhance) {
                var bar = document.querySelector('.action-bar');
                if (bar) {
                    var b = document.createElement('button');
                    b.id = 'btn-enhance';
                    b.className = 'btn btn-warning';
                    b.textContent = '💪 忍术强化 (2查克拉)';
                    b.addEventListener('click', toggleEnhance);
                    bar.appendChild(b);
                }
            } else {
                enhance.disabled = (gameState.turn !== localPlayerId || gameState.gameOver);
                enhance.textContent = gameState.enhancePending ? '❌ 取消强化' : '💪 忍术强化 (2查克拉)';
                if (gameState.enhancePending) enhance.classList.add('active');
                else enhance.classList.remove('active');
            }
        }

        function toggleEnhance() {
            if (gameState.turn !== localPlayerId) {
                log('⛔ 不是你的回合，不能使用强化');
                return;
            }
            if (gameState.gameOver) { log('⛔ 游戏已结束'); return; }
            var member = getCurrentMember(gameState.turn);
            if (!member) { log('⛔ 没有可用角色'); return; }
            if (member.chakra < 2) { log('⛔ 查克拉不足 (需要2点)'); return; }
            gameState.enhancePending = !gameState.enhancePending;
            if (gameState.enhancePending) {
                log('💠 忍术强化已激活！(+5效果)');
                if (gameState.discardMode) {
                    gameState.discardMode = false;
                    btnDiscard.textContent = '🔄 换牌';
                    btnDiscard.classList.remove('active');
                }
            } else {
                log('💬 已取消强化');
            }
            render();
        }

        // ============================================================
        // 13. 联机通信层
        // ============================================================
        function sendAction(action) {
            if (lobby.conn && lobby.conn.open) {
                lobby.conn.send(JSON.stringify(action));
                console.log('📤 发送:', action);
            } else {
                console.warn('⚠️ 连接未建立，无法发送:', action);
            }
        }

        function handleRemoteAction(action) {
            var localPid = lobby.isHost ? 1 : 2;
            if (action.playerId === localPid) return;
            console.log('📩 收到远程消息:', action);

            switch (action.type) {
                case 'roleSelect':
                    if (action.playerId === 1) {
                        selectedRoles.p1 = action.roles || [];
                    } else if (action.playerId === 2) {
                        selectedRoles.p2 = action.roles || [];
                    }
                    // 立即刷新选人界面和确认按钮
                    if (document.getElementById('role-select-screen').style.display !== 'none') {
                        renderRoleSelection();
                    }
                    break;
                case 'ready':
                    if (action.playerId === 1) readyState.p1 = true;
                    else if (action.playerId === 2) readyState.p2 = true;
                    updateReadyStatus();
                    checkBothReadyAndStart();
                    break;
                case 'startGame':
                    if (!gameState.gameOver && document.getElementById('game-screen').style.display !== 'block') {
                        startGame();
                    }
                    break;
                case 'playCard': {
                    var cardData = action.cardData;
                    var pid = action.playerId;
                    var member = getCurrentMember(pid);
                    if (member) {
                        var idx = member.hand.findIndex(function(c) { return c.name === cardData.name && c.element === cardData
                                .element; });
                        if (idx !== -1) member.hand.splice(idx, 1);
                    }
                    var targetId = pid === 1 ? 2 : 1;
                    var res = applyCardLocal(cardData, pid, targetId);
                    var role = getCurrentRoleObj(pid);
                    var roleName = role ? role.emoji + role.name : '玩家' + pid;
                    log('🧙 ' + roleName + ' 打出 <span class="highlight">' + cardData.element + ' ' + cardData.name +
                        '</span> → ' + res.log);
                    triggerPassive(pid, targetId);
                    render();
                    break;
                }
                case 'discard': {
                    var pid2 = action.playerId;
                    var member2 = getCurrentMember(pid2);
                    if (member2) {
                        var idx2 = member2.hand.findIndex(function(c) { return c.element === action.element && c.name === action
                                .name; });
                        if (idx2 !== -1) member2.hand.splice(idx2, 1);
                        var newCard = drawOne(pid2);
                        if (newCard) { /* drawOne 已处理添加 */ }
                        member2.discarded = true;
                    }
                    log('🔄 玩家' + pid2 + ' 换牌 (' + action.element + ' ' + action.name + ')');
                    render();
                    break;
                }
                case 'synthesize': {
                    var pid3 = action.playerId;
                    var member3 = getCurrentMember(pid3);
                    if (member3) {
                        var removed = 0;
                        var newHand = [];
                        for (var i = 0; i < member3.hand.length; i++) {
                            var c = member3.hand[i];
                            if (removed < 2 && c.element === action.target && c.level === 'base') {
                                removed++;
                                continue;
                            }
                            newHand.push(c);
                        }
                        var adv = ADV_MAP[action.target];
                        if (adv) {
                            newHand.push(JSON.parse(JSON.stringify(adv)));
                            member3.hand = newHand;
                            if (member3.chakra < 3) member3.chakra++;
                            showSynthesisEffect();
                            log('🔮 玩家' + pid3 + ' 合成！' + action.target + ' → ' + action.advName);
                        }
                    }
                    render();
                    break;
                }
                case 'substitute': {
                    var pid4 = action.playerId;
                    var member4 = getCurrentMember(pid4);
                    if (member4 && member4.freeze > 0) {
                        member4.chakra -= 1;
                        member4.freeze = 0;
                        clearStateEffects(pid4);
                        log('🪵 玩家' + pid4 + ' 使用替身术解除冻结！');
                    }
                    render();
                    break;
                }
                case 'endTurn': {
                    // 更新回合
                    gameState.turn = action.playerId === 1 ? 2 : 1;
                    gameState.roundCounter = action.roundCounter || gameState.roundCounter;
                    log('🔄 轮到玩家' + gameState.turn + '的回合');
                    // 强制刷新UI
                    render();
                    console.log('✅ 收到 endTurn，当前 turn =', gameState.turn, 'localPlayerId =', localPlayerId);
                    break;
                }
                case 'gameOver': {
                    gameState.gameOver = true;
                    gameState.winner = action.winner;
                    showVictory(action.winner);
                    render();
                    break;
                }
                default:
                    break;
            }
        }

        // ============================================================
        // 14. 大厅管理
        // ============================================================
        function updateLobbyUI(message) {
            var label = document.getElementById('lobby-status-label');
            var value = document.getElementById('lobby-status-value');
            var detail = document.getElementById('lobby-status-detail');
            var msgEl = document.getElementById('lobby-message');

            if (lobby.roomIndex === -1) {
                label.textContent = '当前状态';
                value.textContent = '未进入房间';
                detail.textContent = '';
                document.getElementById('lobby-create').disabled = false;
                document.getElementById('lobby-join').disabled = false;
            } else {
                var roomNum = lobby.roomIndex + 1;
                if (lobby.isHost && lobby.password) {
                    label.textContent = '🏠 房间 ' + roomNum + ' (房主)';
                    value.textContent = '🔑 密码: ' + lobby.password;
                    detail.textContent = '等待对手加入... 分享密码给对手';
                    document.getElementById('lobby-create').disabled = true;
                    document.getElementById('lobby-join').disabled = true;
                } else if (lobby.isHost && !lobby.password) {
                    label.textContent = '🏠 房间 ' + roomNum + ' (房主)';
                    value.textContent = '⚔️ 对战中';
                    detail.textContent = '正在对战...';
                    document.getElementById('lobby-create').disabled = true;
                    document.getElementById('lobby-join').disabled = true;
                } else if (!lobby.isHost && lobby.conn) {
                    label.textContent = '🏠 房间 ' + roomNum + ' (加入者)';
                    value.textContent = '⚔️ 对战中';
                    detail.textContent = '正在对战...';
                    document.getElementById('lobby-create').disabled = true;
                    document.getElementById('lobby-join').disabled = true;
                }
            }
            if (message) msgEl.textContent = message;
            else msgEl.textContent = '';
        }

        function createRoom() {
            if (lobby.roomIndex !== -1) {
                document.getElementById('lobby-message').textContent = '你已经在房间中。';
                return;
            }
            doCreateRoom(0);
        }

        function doCreateRoom(index) {
            var roomId = ROOM_IDS[index];
            var password = String(1000 + Math.floor(Math.random() * 9000));
            var peer = new Peer(roomId, { debug: 0 });
            peer.on('open', function(id) {
                lobby.peer = peer;
                lobby.roomIndex = index;
                lobby.isHost = true;
                lobby.password = password;
                lobby.conn = null;
                lobby.gameStarted = false;
                lobby.gameOver = false;
                localPlayerId = 1;
                updateLobbyUI('房间已创建，等待对手加入...');
                peer.on('connection', function(conn) {
                    lobby.conn = conn;
                    conn.on('open', function() {
                        var verified = false;
                        var authHandler = function(data) {
                            try {
                                var msg = JSON.parse(data);
                                console.log('📨 房主收到认证消息:', msg);
                                if (msg.type === 'auth' && msg.password === password) {
                                    verified = true;
                                    conn.send(JSON.stringify({ type: 'auth_ok' }));
                                    conn.off('data', authHandler);
                                    conn.on('data', function(data2) {
                                        try {
                                            var msg2 = JSON.parse(data2);
                                            handleRemoteAction(msg2);
                                        } catch (e) { console.error(
                                            '解析错误:', e); }
                                    });
                                    lobby.gameStarted = true;
                                    startRoleSelection('host');
                                } else if (msg.type === 'auth') {
                                    conn.send(JSON.stringify({ type: 'auth_fail' }));
                                    conn.close();
                                }
                            } catch (e) { console.error('解析错误:', e); }
                        };
                        conn.on('data', authHandler);
                        setTimeout(function() {
                            if (!verified) {
                                conn.close();
                                updateLobbyUI('连接超时，请重试。');
                            }
                        }, 10000);
                    });
                    conn.on('close', function() { handleDisconnect(); });
                });
                document.getElementById('lobby-create').disabled = true;
                document.getElementById('lobby-join').disabled = true;
            });
            peer.on('error', function(err) {
                document.getElementById('lobby-message').textContent = '创建失败: ' + err.message;
                lobby.roomIndex = -1;
                lobby.isHost = false;
                updateLobbyUI();
            });
        }

        function joinRoom() {
            if (lobby.roomIndex !== -1) {
                document.getElementById('lobby-message').textContent = '你已经在房间中。';
                return;
            }
            var roomNum = prompt('请输入房间号 (1~5):');
            if (!roomNum) return;
            var index = parseInt(roomNum) - 1;
            if (isNaN(index) || index < 0 || index >= MAX_ROOMS) {
                alert('房间号必须为 1 到 5 的数字。');
                return;
            }
            var password = prompt('请输入4位密码:');
            if (!password || password.length !== 4) {
                alert('密码必须为4位数字。');
                return;
            }

            var roomId = ROOM_IDS[index];
            var peer = new Peer({ debug: 0 });
            peer.on('open', function(id) {
                var conn = peer.connect(roomId);
                lobby.peer = peer;
                lobby.conn = conn;
                lobby.roomIndex = index;
                lobby.isHost = false;
                lobby.password = null;
                lobby.gameStarted = false;
                lobby.gameOver = false;
                localPlayerId = 2;
                updateLobbyUI('正在连接...');
                conn.on('open', function() {
                    conn.send(JSON.stringify({ type: 'auth', password: password }));
                    var authHandler = function(data) {
                        try {
                            var msg = JSON.parse(data);
                            console.log('📨 加入者收到认证响应:', msg);
                            if (msg.type === 'auth_ok') {
                                conn.off('data', authHandler);
                                conn.on('data', function(data2) {
                                    try {
                                        var msg2 = JSON.parse(data2);
                                        handleRemoteAction(msg2);
                                    } catch (e) { console.error(
                                        '解析错误:', e); }
                                });
                                lobby.gameStarted = true;
                                startRoleSelection('guest');
                            } else if (msg.type === 'auth_fail') {
                                conn.close();
                                alert('密码错误！');
                                lobby.roomIndex = -1;
                                updateLobbyUI();
                            }
                        } catch (e) { console.error('解析错误:', e); }
                    };
                    conn.on('data', authHandler);
                    setTimeout(function() {
                        if (!lobby.gameStarted) {
                            conn.close();
                            alert('连接超时');
                            lobby.roomIndex = -1;
                            updateLobbyUI();
                        }
                    }, 10000);
                });
                conn.on('close', function() { handleDisconnect(); });
            });
            peer.on('error', function(err) {
                alert('连接失败，请检查房间号/密码是否正确。');
                lobby.roomIndex = -1;
                updateLobbyUI();
            });
        }

        function handleDisconnect() {
            if (gameState.gameOver) return;
            var localPid = lobby.isHost ? 1 : 2;
            var winner = localPid === 1 ? 1 : 2;
            gameState.gameOver = true;
            gameState.winner = winner;
            log('💀 对手断开连接，玩家' + winner + '获胜！');
            showVictory(winner);
            render();
            updateLobbyUI('对手已断开');
        }

        // ============================================================
        // 15. 角色选择（同步加强版）
        // ============================================================
        function startRoleSelection(role) {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('role-select-screen').style.display = 'block';
            document.getElementById('role-p1-title').textContent = role === 'host' ? '👹 玩家一 (房主)' : '👹 玩家一';
            document.getElementById('role-p2-title').textContent = role === 'guest' ? '🧙 玩家二 (加入者)' : '🧙 玩家二';
            selectedRoles = { p1: [], p2: [] };
            readyState = { p1: false, p2: false };
            renderRoleSelection();
        }

        function sendRoleSelection() {
            var key = localPlayerId === 1 ? 'p1' : 'p2';
            var roles = selectedRoles[key];
            console.log('📤 发送选人:', { playerId: localPlayerId, roles: roles });
            sendAction({ type: 'roleSelect', playerId: localPlayerId, roles: roles });
        }

        function renderRoleSelection() {
            var p1List = document.getElementById('p1-role-list');
            var p2List = document.getElementById('p2-role-list');
            if (!p1List || !p2List) return;

            p1List.innerHTML = '';
            p2List.innerHTML = '';

            var isP1Local = (localPlayerId === 1);
            var isP2Local = (localPlayerId === 2);

            Object.values(ROLES).forEach(function(role) {
                var btn = document.createElement('button');
                var isSelected = selectedRoles.p1.includes(role.id);
                var isDisabled = !isSelected && selectedRoles.p1.length >= 2;
                var isLocal = isP1Local;
                btn.className = 'role-btn' + (isSelected ? ' selected' : '') + (isDisabled || !isLocal ? ' disabled' : '');
                btn.innerHTML = isLocal ?
                    '<div class="role-name">' + role.emoji + ' ' + role.name +
                    ' <span style="font-size:12px;color:#7a6a5a;">(' + role.faction + ')</span></div>' +
                    '<div class="role-skill">技能：' + role.skillName + ' — <span>' + role.skillDesc + '</span></div>' :
                    '<div class="role-name" style="color:#5a4a3a;">❓ 对手已选</div>';
                btn.onclick = function() {
                    if (isDisabled || !isLocal) return;
                    var idx = selectedRoles.p1.indexOf(role.id);
                    if (idx >= 0) {
                        selectedRoles.p1.splice(idx, 1);
                    } else if (selectedRoles.p1.length < 2) {
                        selectedRoles.p1.push(role.id);
                    }
                    renderRoleSelection();
                    updateConfirmButton();
                    sendRoleSelection();
                };
                p1List.appendChild(btn);
            });

            Object.values(ROLES).forEach(function(role) {
                var btn = document.createElement('button');
                var isSelected = selectedRoles.p2.includes(role.id);
                var isDisabled = !isSelected && selectedRoles.p2.length >= 2;
                var isLocal = isP2Local;
                btn.className = 'role-btn' + (isSelected ? ' selected' : '') + (isDisabled || !isLocal ? ' disabled' : '');
                btn.innerHTML = isLocal ?
                    '<div class="role-name">' + role.emoji + ' ' + role.name +
                    ' <span style="font-size:12px;color:#7a6a5a;">(' + role.faction + ')</span></div>' +
                    '<div class="role-skill">技能：' + role.skillName + ' — <span>' + role.skillDesc + '</span></div>' :
                    '<div class="role-name" style="color:#5a4a3a;">❓ 对手已选</div>';
                btn.onclick = function() {
                    if (isDisabled || !isLocal) return;
                    var idx = selectedRoles.p2.indexOf(role.id);
                    if (idx >= 0) {
                        selectedRoles.p2.splice(idx, 1);
                    } else if (selectedRoles.p2.length < 2) {
                        selectedRoles.p2.push(role.id);
                    }
                    renderRoleSelection();
                    updateConfirmButton();
                    sendRoleSelection();
                };
                p2List.appendChild(btn);
            });

            document.getElementById('p1-count').textContent = '已选 ' + selectedRoles.p1.length + ' / 2';
            document.getElementById('p2-count').textContent = '已选 ' + selectedRoles.p2.length + ' / 2';
            updateConfirmButton();
            updateReadyStatus();
            console.log('🔄 当前选择:', selectedRoles);
        }

        function updateConfirmButton() {
            var btn = document.getElementById('role-confirm-btn');
            var p1Ok = selectedRoles.p1 && selectedRoles.p1.length === 2;
            var p2Ok = selectedRoles.p2 && selectedRoles.p2.length === 2;
            btn.disabled = !(p1Ok && p2Ok);
            if (!btn.disabled) btn.textContent = '⚔️ 确认出战 (双方已选好)';
            else btn.textContent = '⚔️ 请双方各选 2 名忍者 (' + (selectedRoles.p1 ? selectedRoles.p1.length : 0) + '/2, ' + (
                selectedRoles.p2 ? selectedRoles.p2.length : 0) + '/2)';
        }

        function updateReadyStatus() {
            var statusEl = document.getElementById('ready-status');
            if (!statusEl) return;
            var myReady = localPlayerId === 1 ? readyState.p1 : readyState.p2;
            var oppReady = localPlayerId === 1 ? readyState.p2 : readyState.p1;
            if (gameState.gameOver) return;
            if (myReady && oppReady) {
                statusEl.innerHTML = '✅ 双方已确认，战斗即将开始...';
            } else if (myReady) {
                statusEl.innerHTML = '⏳ 你已确认，等待对手确认...';
            } else {
                statusEl.innerHTML = '📝 选好忍者后点击确认出战';
            }
        }

        function onConfirm() {
            if (selectedRoles.p1.length !== 2 || selectedRoles.p2.length !== 2) {
                alert('请双方各选 2 名忍者。');
                return;
            }
            if (localPlayerId === 1) readyState.p1 = true;
            else readyState.p2 = true;
            sendAction({ type: 'ready', playerId: localPlayerId });
            updateReadyStatus();
            checkBothReadyAndStart();
        }

        function checkBothReadyAndStart() {
            if (readyState.p1 && readyState.p2) {
                startGame();
            }
        }

        function startGame() {
            if (gameState.gameOver) return;
            var p1Selected = selectedRoles.p1 || [];
            var p2Selected = selectedRoles.p2 || [];
            if (p1Selected.length !== 2 || p2Selected.length !== 2) return;

            var p1Roles = p1Selected.map(function(rid) {
                return { roleId: rid, hp: 50, maxHp: 50, burn: 0, freeze: 0, shield: 0, chakra: 0, discarded: false,
                    hand: [] };
            });
            var p2Roles = p2Selected.map(function(rid) {
                return { roleId: rid, hp: 50, maxHp: 50, burn: 0, freeze: 0, shield: 0, chakra: 0, discarded: false,
                    hand: [] };
            });

            gameState.teams.p1.members = p1Roles;
            gameState.teams.p2.members = p2Roles;
            gameState.teams.p1.currentIndex = 0;
            gameState.teams.p2.currentIndex = 0;
            gameState.turn = 1;
            gameState.gameOver = false;
            gameState.discardMode = false;
            gameState.enhancePending = false;
            gameState.roundCounter = 1;
            gameState.totalDamage = { p1: 0, p2: 0 };
            gameState.totalHeal = { p1: 0, p2: 0 };
            gameState.totalBurnDamage = { p1: 0, p2: 0 };
            gameState.skillTriggered = {
                p1: { shadow_clone: false, sharingan: false, mangekyo: false, samehada: false, summon: false,
                    reflect: false },
                p2: { shadow_clone: false, sharingan: false, mangekyo: false, samehada: false, summon: false,
                    reflect: false }
            };
            gameState.lastPlayedCard = { p1: null, p2: null };
            gameState.winner = null;

            clearHandDOM(1);
            clearHandDOM(2);
            [1, 2].forEach(function(pid) {
                var member = getCurrentMember(pid);
                if (member) {
                    member.hand = [];
                    var initialCards = [
                        { name: '螺旋丸', element: '🌀', atk: 5, heal: 0, level: 'base' },
                        { name: '千杀水翔', element: '❄️', atk: 4, heal: 0, level: 'base' },
                        { name: '掌仙术', element: '🌿', atk: 0, heal: 6, level: 'base' },
                        { name: '千鸟', element: '⚡', atk: 8, heal: 0, level: 'base' }
                    ];
                    initialCards.forEach(function(c) {
                        member.hand.push(c);
                        if (pid === localPlayerId) addCardToDOM(pid, c);
                    });
                }
            });

            clearLog();
            log('🍥 2v2 忍界大战开始！');
            p1Selected.forEach(function(rid) { var r = ROLES[rid];
                log('👹 玩家一：' + r.emoji + ' ' + r.name); });
            p2Selected.forEach(function(rid) { var r = ROLES[rid];
                log('🧙 玩家二：' + r.emoji + ' ' + r.name); });
            log('📊 第 1 回合开始');

            document.getElementById('role-select-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('btn-back-home').classList.add('show');
            render();

            sendAction({ type: 'startGame' });
        }

        // ============================================================
        // 16. 导航
        // ============================================================
        function goHome() {
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('role-select-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('victory-overlay').style.display = 'none';
            document.getElementById('btn-back-home').classList.remove('show');
            if (lobby.peer) { lobby.peer.destroy();
                lobby.peer = null; }
            lobby.conn = null;
            lobby.roomIndex = -1;
            lobby.isHost = false;
            lobby.password = null;
            lobby.gameStarted = false;
            lobby.gameOver = false;
            updateLobbyUI();
            document.getElementById('lobby-create').disabled = false;
            document.getElementById('lobby-join').disabled = false;
        }

        function openRulebook() { document.getElementById('rulebook-overlay').style.display = 'block'; }

        function closeRulebook() { document.getElementById('rulebook-overlay').style.display = 'none'; }

        // ============================================================
        // 17. 初始化事件
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('btn-lobby').addEventListener('click', function() {
                document.getElementById('home-screen').classList.add('hidden');
                document.getElementById('lobby-screen').style.display = 'block';
                updateLobbyUI();
            });
            document.getElementById('btn-ai').addEventListener('click', function() {
                alert(
                    '🤖 单人模式 (VS AI) 功能保留，但联机版暂不包含完整AI逻辑。\n请使用联机大厅进行对战。'
                    );
            });
            document.getElementById('lobby-back-home').addEventListener('click', goHome);
            document.getElementById('btn-back-home').addEventListener('click', goHome);
            document.getElementById('btn-rulebook-home').addEventListener('click', openRulebook);
            document.getElementById('btn-rulebook-game').addEventListener('click', openRulebook);
            document.getElementById('rulebook-close').addEventListener('click', closeRulebook);
            document.getElementById('rulebook-overlay').addEventListener('click', function(e) {
                if (e.target === this) closeRulebook();
            });

            document.getElementById('lobby-create').addEventListener('click', createRoom);
            document.getElementById('lobby-join').addEventListener('click', joinRoom);

            btnSynth.addEventListener('click', synthesize);
            btnDiscard.addEventListener('click', function() {
                if (gameState.turn !== localPlayerId) {
                    log('⛔ 不是你的回合，不能换牌');
                    return;
                }
                if (gameState.gameOver) { log('⛔ 游戏已结束'); return; }
                var member = getCurrentMember(gameState.turn);
                if (!member) { log('⛔ 没有可用角色'); return; }
                if (member.freeze > 0) { log('❄️ 被冻结，无法换牌'); return; }
                if (member.discarded) { log('⛔ 本回合已换过牌'); return; }
                gameState.discardMode = !gameState.discardMode;
                if (gameState.discardMode) {
                    gameState.enhancePending = false;
                    log('🔄 进入换牌模式，点击要弃的牌');
                } else {
                    log('💬 已取消换牌');
                }
                render();
            });
            btnEnd.addEventListener('click', endTurn);
            btnRestart.addEventListener('click', function() {
                alert('重启功能暂未实现，请返回大厅重新开房。');
            });
            btnSubstitute.addEventListener('click', useSubstitute);

            document.getElementById('role-confirm-btn').addEventListener('click', onConfirm);

            document.getElementById('victory-restart-btn').addEventListener('click', function() {
                document.getElementById('victory-overlay').style.display = 'none';
                if (lobby.roomIndex !== -1) {
                    if (lobby.conn) { lobby.conn.close();
                        lobby.conn = null; }
                    if (lobby.peer) { lobby.peer.destroy();
                        lobby.peer = null; }
                    lobby.roomIndex = -1;
                    lobby.isHost = false;
                    lobby.password = null;
                    lobby.gameStarted = false;
                    lobby.gameOver = false;
                    updateLobbyUI();
                    document.getElementById('lobby-create').disabled = false;
                    document.getElementById('lobby-join').disabled = false;
                }
                document.getElementById('game-screen').style.display = 'none';
                document.getElementById('lobby-screen').style.display = 'block';
                updateLobbyUI();
            });

            document.getElementById('home-screen').classList.remove('hidden');
        });

        console.log('🟢 Shinobi Synthesis v1.2 加载完成！');
        console.log('📌 版本特性：回合权限修复，选人同步增强');
    </script>
</body>
</html>
